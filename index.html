<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPE Assembly Number System</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <h1>FPE Automation</h1>
                <p>Assembly Number System</p>
            </div>
            <button id="login-btn" class="btn btn-primary btn-large">Sign in with Microsoft</button>
            <p id="login-error" class="login-error hidden"></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">

        <header class="app-header">
            <div class="header-brand">
                <h1>FPE Automation</h1>
                <span>Assembly Number System</span>
            </div>
            <div class="header-user">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn btn-outline-light">Sign Out</button>
            </div>
        </header>

        <div class="app-body">

            <!-- Left Panel -->
            <div class="left-panel">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search assemblies..." autocomplete="off" />
                    <button id="search-btn" class="btn btn-icon" title="Search">&#128269;</button>
                </div>
                <button id="new-btn" class="btn btn-primary btn-new">+ New Assembly</button>
                <div id="assembly-list" class="assembly-list">
                    <div class="list-empty">Enter a search term to find assemblies</div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">

                <!-- Empty state -->
                <div id="empty-state" class="empty-state">
                    <div>
                        <p>Search for an assembly or create a new one</p>
                    </div>
                </div>

                <!-- Detail view -->
                <div id="detail-view" class="detail-view hidden">
                    <div class="panel-header">
                        <div id="detail-title" class="panel-title"></div>
                        <div class="panel-actions">
                            <button id="edit-btn" class="btn btn-primary">Edit</button>
                            <button id="delete-btn" class="btn btn-danger">Delete</button>
                        </div>
                    </div>
                    <div id="detail-content" class="detail-content"></div>
                </div>

                <!-- Form view -->
                <div id="form-view" class="form-view hidden">
                    <div class="panel-header">
                        <h2 id="form-title" class="panel-title">New Assembly</h2>
                        <div class="panel-actions">
                            <button id="save-btn" class="btn btn-primary">Save</button>
                            <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
                        </div>
                    </div>
                    <form id="assembly-form" class="assembly-form" onsubmit="return false">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Assembly Number</label>
                                <input type="text" id="f-assembly-number" readonly class="readonly" placeholder="Select type first..." />
                            </div>
                            <div class="form-group">
                                <label>Assembly Type <span class="required">*</span></label>
                                <select id="f-assembly-type">
                                    <option value="">Select type...</option>
                                    <option value="EBA">EBA</option>
                                    <option value="FPE">FPE</option>
                                    <option value="FPEVAS">FPEVAS</option>
                                    <option value="FPEHS">FPEHS</option>
                                    <option value="SMA">SMA</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label>Description <span class="required">*</span></label>
                                <input type="text" id="f-title" placeholder="Assembly description..." />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Revision</label>
                                <input type="text" id="f-revision" />
                            </div>
                            <div class="form-group">
                                <label>Client P/N</label>
                                <input type="text" id="f-client-pn" />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width client-group">
                                <label>Client</label>
                                <input type="text" id="f-client-search" placeholder="Type to search clients..." autocomplete="off" />
                                <div id="client-suggestions" class="suggestions hidden"></div>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="delete-modal" class="modal hidden">
            <div class="modal-overlay" id="modal-overlay"></div>
            <div class="modal-card">
                <h3>Delete Assembly</h3>
                <p>Are you sure you want to delete <strong id="delete-assembly-name"></strong>? This cannot be undone.</p>
                <div class="modal-actions">
                    <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
                    <button id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Toast notification -->
        <div id="toast" class="toast hidden"></div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
